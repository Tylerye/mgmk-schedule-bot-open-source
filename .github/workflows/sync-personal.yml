name: Recover personal pilot source
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-source-recovery
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/sync-personal-source.js
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          PARSER_SHARED_SECRET: ${{ secrets.PARSER_SHARED_SECRET }}
