name: Verify bot

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:privacy
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Check Cloudflare bundle
        run: npx --no-install wrangler deploy --config wrangler.example.jsonc --dry-run --outdir /tmp/mgmk-worker
      - name: Check isolated personal Worker bundle
        run: npx --no-install wrangler deploy --config wrangler.personal.example.jsonc --dry-run --outdir /tmp/mgmk-personal-worker
      - name: Check standalone Docker runtime
        if: matrix.node == 24
        run: |
          docker build -t mgmk-schedule-bot:ci .
          docker run --rm --entrypoint node mgmk-schedule-bot:ci --input-type=module -e "import { openLocalAttention } from './src/attention-local.js'; await openLocalAttention('/tmp/attention.sqlite'); console.log('Docker migrations loaded');"
